[build-system]
requires = ["uv-build >=0.10.2,<0.13.0"]
build-backend = "uv_build"

[project]
name = "gandharva"
version = "0.0.3"
description = "All-purpose data science application builder"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Framework :: Pydantic :: 2",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: User Interfaces",
    "Typing :: Typed",
]
dependencies = [
    "beautifulsoup4[lxml] >=4.15.0,<5.0.0; python_version >= '3.12'",
    "distributed >=2026.1.1",
    "fastapi >=0.119.1,<2.0.0",
    "hypothesis-jsonschema >=0.23.1,<2.0.0",
    "kiss-headers >=2.4.0,<3.0.0; python_version >= '3.12'",
    "lumen >=0.6.1,<2.0.0",
    "lxml >=6.0.1,<7.0.0; python_version >= '3.12'",
    "netcdf4 >=1.7.3,<2.0.0",
    "packaging >=26.0.0",
    "pandera[xarray] >=0.32.1,<2.0.0",
    "panel >=1.9.1,<2.0.0",
    "panel >=1.10.0b1; python_version >= '3.12'",
    "panel-material-ui >=0.13.0,<2.0.0",
    "platformdirs >=4.6.0,<5.0.0",
    "pydantic >=2.12.4,<4.0.0",
    "pydantic-settings >=2.13.0,<4.0.0",
    "rich >=14.2.0",
    "rich-argparse >=1.7.2,<2.0.0",
    "textual-image >=0.8.5,!=0.9.0,!=0.10.0,!=0.11.0,!=0.12.0,!=0.13.0,!=0.13.1,<2.0.0",
    "typing-extensions >=4.15.0,<5.0.0",
    "universal-pathlib >=0.3.10,<2.0.0",
    "zarr >=2.18.3,<4.0.0",
]

[project.optional-dependencies]
typing = [
    "metpy >=1.7.0,<2.0.0",
    "pandas-stubs >=1.4.2,<4.0.0",
]

[dependency-groups]
dev = [
    "aiohttp >=3.13.0",
    "attrs >=25.4.0",
    "basedpyright >=1.40.1",
    "beautifulsoup4[lxml] >=4.15.0",
    "gandharva[typing]",
    "httpx2 >=2.2.0",
    "hvsampledata >=0.1.5",
    "lxml >=6.0.1",
    "types-lxml >=2026.2.16",
    "nodejs-wheel-binaries <=20.18.0; sys_platform == 'darwin' and platform_release < '20'",
    "nodejs-wheel-binaries <=22.20.0; sys_platform == 'darwin' and platform_release < '22'",
    "pyproj <=3.6.1; sys_platform == 'darwin' and platform_machine == 'x86_64' and platform_release < '21' and python_version < '3.13'",
    "pyproj <=3.6.1; sys_platform == 'darwin' and platform_machine == 'arm64' and platform_release < '23' and python_version < '3.13'",
    "pyproj <=3.7.0; sys_platform == 'darwin' and platform_machine == 'x86_64' and platform_release < '22' and python_version < '3.14'",
    "pytest >=9.1.1",
    "ruff >=0.16.9",
    "tombi >=1.5.5",
    "uvicorn >=0.38.0",
]

[[project.authors]]
name = "hingebase"
email = "zcliu@pku.edu.cn"

[project.urls]
Homepage = "https://github.com/hingebase/gandharva"
"Source Code" = "https://github.com/hingebase/gandharva"
"Issue Tracker" = "https://github.com/hingebase/gandharva/issues"

[tool.basedpyright]
failOnWarnings = true
reportUnnecessaryTypeIgnoreComment = "warning"
strict = ["."]
typeCheckingMode = "off"

[tool.ruff]
extend-exclude = [".pixi"]
line-length = 79
preview = true

[tool.ruff.lint]
select = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["assert", "implicit-namespace-package"]
"!**/conftest.py" = ["pytest-fixture-autouse"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 72

[tool.ruff.lint.pylint]
allow-dunder-method-names = ["__panel__"]

[tool.tombi.files]
exclude = [".venv/**/*.toml"]

[tool.tombi.lint.rules]
tables-out-of-order = "off"

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

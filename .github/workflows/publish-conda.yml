name: Conda

on:
  push:
    tags:
      - v*
  workflow_dispatch:

permissions: read-all

jobs:
  build:
    name: Build package
    permissions:
      id-token: write
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0
        with:
          run-install: false

      # https://github.com/prefix-dev/pixi/blob/v0.84.2/crates/pixi_cli/src/publish/discovery.rs#L104-L106
      - run: sed -i 's/publish = false/publish = true/' packages/gandharva/pixi.toml
      - run: >-
          pixi publish
          --generate-attestation
          --package-format 'conda:22'
          --target-channel prefix://prefix.dev/hingebase/gandharva
      - run: git restore packages/gandharva/pixi.toml

      - run: sed -i 's/publish = false/publish = true/' packages/gandharva-py310/pixi.toml
      - run: >-
          pixi publish
          --generate-attestation
          --package-format 'conda:22'
          --target-channel prefix://prefix.dev/hingebase/gandharva
      - run: git restore packages/gandharva-py310/pixi.toml

      - run: sed -i 's/publish = false/publish = true/' packages/gandharva-py311/pixi.toml
      - run: >-
          pixi publish
          --generate-attestation
          --package-format 'conda:22'
          --target-channel prefix://prefix.dev/hingebase/gandharva

# This should match the minimum supported Pixi version
#:schema https://pixi.prefix.dev/v0.71.0/schema/manifest/schema.json

[workspace]
channels = ["conda-forge"]
platforms = [
    "linux-64",
    "linux-aarch64",
    { platform = "osx-64", macos = "10.15" },
    { platform = "osx-arm64", macos = "11.0" },
    "win-64",
]
preview = ["pixi-build"]
requires-pixi = ">=0.71.0"

[package.build.backend]
name = "pixi-build-python"
version = ">=0.6.0,<0.9.0"
channels = ["https://prefix.dev/hingebase/catalina-backports"]

[package.build.config]
ignore-pypi-mapping = true

[package.host-dependencies]
uv = ">=0.10.2,<0.13.0"

[package.run-dependencies]
fastapi-core = ">=0.119.1,<2.0.0"
ffmpeg = ">=4.3.0"
hypothesis-jsonschema = ">=0.23.1,<2.0.0"
lumen = ">=0.6.1,<2.0.0"
netcdf4 = ">=1.7.3,<2.0.0"
packaging = ">=26.0.0"
pandera-xarray = ">=0.32.1,<2.0.0"
panel = ">=1.9.1,<2.0.0"
panel-material-ui = ">=0.13.0,<2.0.0"
platformdirs = ">=4.6.0,<5.0.0"
pydantic = ">=2.12.4,<4.0.0"
pydantic-settings = ">=2.13.0,<4.0.0"
rich = ">=14.2.0"
rich-argparse = ">=1.7.2,<2.0.0"
textual-image = ">=0.8.5,!=0.9.0,!=0.10.0,!=0.11.0,!=0.12.0,!=0.13.0,!=0.13.1,<2.0.0"
typing-extensions = ">=4.15.0,<5.0.0"
universal-pathlib = ">=0.3.10,<2.0.0"
zarr = ">=2.18.3,<4.0.0"

[package.run-constraints]
azure-identity = ">=1.25.2"  # Python 3.14 support
# Broken wheels
pycairo = "<=1.26.1"
pygobject = "<=3.48.2"

[target]
linux-64 = { dependencies = { libblas = { build = "*_mkl" } } }
linux-aarch64 = { dependencies = { libblas = { build = "*_openblas" } } }
# https://conda-forge.org/news/2025/07/31/new-accelerate-macos/
osx = { dependencies = { libblas = { build = "*accelerate" } } }
win-64 = { dependencies = { libblas = { build = "*_mkl" } } }

[dependencies]
aiohttp = ">=3.13.0"
attrs = ">=25.4.0"
basedpyright = ">=1.39.8"
ffmpeg = { build = "lgpl_*" }
gandharva = { path = "." }
httpx = ">=0.28.1"
httpx2 = ">=2.2.0"
hvsampledata = ">=0.1.5"
metpy = ">=1.7.0,<2.0.0"
pandas-stubs = ">=1.4.2,<4.0.0"
pytest = ">=9.1.1"
uv = ">=0.10.2"
uvicorn = ">=0.38.0"

[environments]
default = ["py310"]
py314 = ["py314"]

[feature.py310]
channels = ["conda-forge", "https://prefix.dev/github-releases"]
dependencies = { python-gil = "3.10.*" }

[feature.py310.target.linux.dependencies]
ruff = ">=0.16.1"
tombi = ">=1.2.10"

[feature.py310.target.osx-64.dependencies]
ruff = { version = ">=0.16.1", channel = "https://prefix.dev/github-releases" }
tombi = { version = ">=1.4.0", channel = "https://prefix.dev/github-releases" }

[feature.py310.target.osx-arm64.dependencies]
ruff = ">=0.16.1"
tombi = ">=1.2.10"

[feature.py310.target.win-64.dependencies]
ruff = ">=0.16.1"
tombi = ">=1.2.10"

[feature.py314.dependencies]
python-gil = "3.14.*"

[tasks]
pytest = "pytest"
test = [
    { task = "pytest", environment = "default" },
    { task = "pytest", environment = "py314" },
]

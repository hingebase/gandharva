# This should match the minimum supported Pixi version
#:schema https://pixi.prefix.dev/v0.84.1/schema/manifest/schema.json

[workspace]
channels = ["conda-forge"]
platforms = [
    "linux-64",
    "linux-aarch64",
    { platform = "osx-64", macos = "10.15" },
    { platform = "osx-64", macos = "11.0" },
    { platform = "osx-arm64", macos = "11.0" },
    "win-64",
]
preview = ["pixi-build"]
requires-pixi = ">=0.84.1"

[workspace.dependencies]
basedpyright = ">=1.40.2"
distributed = ">=2026.1.1"
fastapi-core = ">=0.119.1,!=0.142.0,!=0.142.1,!=0.142.2,!=0.142.3,!=0.142.4,<2.0.0"
ffmpeg = ">=7.1.0"
hypothesis-jsonschema = ">=0.23.1,<2.0.0"
logfire = ">=5.2.0,<6.0.0"
netcdf4 = ">=1.7.3,<2.0.0"
numcodecs = { version = "<=0.16.5", when = "__osx 10.15.*" }
opentelemetry-instrumentation-fastapi = ">=0.42b0"
packaging = ">=26.0.0"
pandera-xarray = ">=0.32.1,<2.0.0"
panel-material-ui = ">=0.13.0,<2.0.0"
"pdfminer.six" = { version = "==20260107", build = "pyhd8ed1ab_1" }
pdfplumber = { version = "==0.11.10", build = "pyhcf101f3_1" }
platformdirs = ">=4.6.0,<5.0.0"
pycairo = { version = "<=1.26.1", when = "__unix" }
pygobject = { version = "<=3.48.2", when = "__unix" }
rich = ">=14.2.0"
rich-argparse = ">=1.7.2,<2.0.0"
ruff = ">=0.17.4"
sdl2 = { version = "<=2.30.10", when = "__osx 10.15.*" }
tombi = ">=1.10.0"
typing-extensions = ">=4.15.0,<5.0.0"
universal-pathlib = ">=0.3.10,<2.0.0"
uv = ">=0.10.2,<0.14.0"
zarr = ">=2.18.3,<4.0.0"

[target]
linux-64 = { dependencies = { libblas = { build = "*_mkl" } } }
linux-aarch64 = { dependencies = { libblas = { build = "*_openblas" } } }
# https://conda-forge.org/news/2025/07/31/new-accelerate-macos/
osx = { dependencies = { libblas = { build = "*accelerate" } } }
win-64 = { dependencies = { libblas = { build = "*_mkl" } } }

[dependencies]
aiohttp = ">=3.13.0"
attrs = ">=25.4.0"
beautifulsoup4 = ">=4.15.0"
ffmpeg = { build = "lgpl_*" }
httpx2 = ">=2.2.0"
hvsampledata = ">=0.1.5"
lxml = ">=6.0.1"
metpy = ">=1.7.0,<2.0.0"
pandas-stubs = ">=1.4.2,<4.0.0"
pytest = ">=9.2.0"
types-lxml = ">=2026.2.16"
uv = ">=0.10.2"
uvicorn = ">=0.38.0"

[environments]
default = ["py311", "catalina", "lumen", "pydantic-core", "tests"]
py310 = ["py310", "catalina"]
py313 = ["py313", "catalina", "lumen", "panel", "pydantic-core"]
py314 = ["py314", "lumen", "panel"]

[feature.catalina]
platforms = [
    "linux-64",
    "linux-aarch64",
    "osx-64-macos-10-15",
    "osx-arm64-macos-11-0",
    "win-64",
]

[feature.lumen]
channels = ["pyviz"]

[feature.lumen.dependencies]
lumen = { channel = "pyviz" }

[feature.panel]
channels = ["pyviz", "pyviz/label/dev"]

[feature.panel.dependencies]
panel = { channel = "pyviz/label/dev" }
panel-material-ui = { channel = "pyviz" }

[feature.pydantic-core]
channels = ["https://prefix.dev/hingebase/gandharva"]

[feature.pydantic-core.target.osx-64.dependencies]
pydantic-core = { channel = "https://prefix.dev/hingebase/gandharva" }

[feature.py310.dependencies]
gandharva = { path = "packages/gandharva-py310" }

[feature.py311.dependencies]
basedpyright = { workspace = true }
gandharva = { path = "packages/gandharva-py311" }

[feature.py313.dependencies]
basedpyright = { workspace = true }
gandharva = { path = "packages/gandharva" }
python-gil = "3.13.*"

[feature.py314]
channels = ["conda-forge", "conda-pypi"]
platforms = [
    "linux-64",
    "linux-aarch64",
    "osx-64-macos-11-0",
    "osx-arm64-macos-11-0",
    "win-64",
]

[feature.py314.dependencies]
basedpyright = { workspace = true }
gandharva = { path = "packages/gandharva" }
python-gil = "3.14.*"

[feature.py314.target.osx-64.dependencies]
markitdown = { channel = "conda-pypi" }

[feature.tests]
channels = ["conda-forge", "https://prefix.dev/github-releases"]

[feature.tests.target.linux.dependencies]
ruff = { workspace = true }
tombi = { workspace = true }

[feature.tests.target.osx-64.dependencies]
ruff = { version = ">=0.17.4", channel = "https://prefix.dev/github-releases" }
tombi = { version = ">=1.10.0", channel = "https://prefix.dev/github-releases" }

[feature.tests.target.osx-arm64.dependencies]
ruff = { workspace = true }
tombi = { workspace = true }

[feature.tests.target.win-64.dependencies]
ruff = { workspace = true }
tombi = { workspace = true }

[feature.tests.tasks]
test = [
    { task = "pytest", environment = "default" },
    { task = "pytest", environment = "py310" },
    { task = "pytest", environment = "py313" },
    { task = "pytest", environment = "py314" },
]

[feature.tests.target.osx-64.tasks]
test = [
    { task = "pytest", environment = "default" },
    { task = "pytest", environment = "py310" },
    { task = "pytest", environment = "py313" },
]

[tasks]
pytest = "pytest"
